name: 云端图片极速修复

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取你的图片
        uses: actions/checkout@v4

      - name: 2. 安装运行环境（Vulkan 驱动）
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libvulkan1 mesa-vulkan-drivers libgl1-mesa-glx

      - name: 3. 下载免安装修复引擎 (Linux版)
        run: |
          curl -L -o realesrgan.zip https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          # 加上 -o 强制解压，不再询问
          unzip -o realesrgan.zip
          chmod +x realesrgan-ncnn-vulkan

      - name: 4. 执行修复
        run: |
          ./realesrgan-ncnn-vulkan -i input.jpg -o output_hd.png -n realesrgan-x4plus -s 4

      - name: 5. 打包上传修复好的图片
        uses: actions/upload-artifact@v4
        with:
          name: 高清修复图
          path: output_hd.png